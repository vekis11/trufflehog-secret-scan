name: Yelp detect-secrets

# Full-repository scan (no baseline allowlist). Fails if any plugin reports a potential secret.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Brutal full-tree scan (fail on any finding)
        shell: bash
        run: |
          set -euo pipefail
          # Exclude only non-source noise: VCS internals, caches, and baseline JSON (hashed values trigger detectors).
          detect-secrets scan --all-files --force-use-all-plugins \
            --exclude-files '^\.git/' \
            --exclude-files '\.pytest_cache' \
            --exclude-files '__pycache__' \
            --exclude-files '\.secrets\.baseline' \
            . > detect_secrets_report.json

          count=$(jq '.results // {} | length' detect_secrets_report.json)

          if [ "$count" -eq 0 ]; then
            echo "detect-secrets: no findings under scanned paths."
            {
              echo "## Yelp detect-secrets"
              echo ""
              echo "No potential secrets reported for scanned paths."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(jq '[.results[] | length] | add' detect_secrets_report.json)

          echo "::error::detect-secrets reported ${total} finding(s) across ${count} file(s). See job summary, log groups below, and the detect-secrets-report artifact."

          echo "::group::Job summary (also on the Workflow run Summary tab)"
          {
            echo "## Yelp detect-secrets — findings"
            echo ""
            echo "**${total}** finding(s) in **${count}** file(s). Download artifact **detect-secrets-report** for full JSON (includes plugin metadata and hashes)."
            echo ""
            echo "| File | Line | Type | Verified |"
            echo "|:--|--:|:--|:--:|"
            jq -r '.results | to_entries[] | .key as $file | .value[] | "| `\($file)` | \(.line_number // "?") | \(.type) | \(.is_verified) |"' detect_secrets_report.json
            echo ""
            echo "<details><summary>Full <code>results</code> object (JSON)</summary>"
            echo ""
            echo '```json'
            jq '.results' detect_secrets_report.json
            echo '```'
            echo ""
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"

          echo "::group::Findings (plain list for log search)"
          jq -r '.results | to_entries[] | .key as $file | .value[] | "\($file):\(.line_number // "?") [\(.type)] verified=\(.is_verified)"' detect_secrets_report.json
          echo "::endgroup::"

          echo "::group::Full scan JSON (stdout)"
          jq . detect_secrets_report.json
          echo "::endgroup::"

          exit 1

      - name: Upload scan JSON (on failure, for download)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detect-secrets-report
          path: detect_secrets_report.json
