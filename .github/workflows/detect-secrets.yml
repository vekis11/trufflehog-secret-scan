name: Yelp detect-secrets

# Static secret scanning (Yelp detect-secrets); separate workflow from TruffleHog.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Verify no new secrets vs baseline
        run: |
          detect-secrets scan --baseline .secrets.baseline --all-files \
            --exclude-files '\.secrets\.baseline' \
            --exclude-files '\.pytest_cache' \
            .
