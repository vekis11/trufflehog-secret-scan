name: TruffleHog

# Full-repository filesystem scan (no path allowlists). Fails the job if TruffleHog reports findings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — full repo filesystem scan
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/trufflesecurity/trufflehog:latest"
          # Scan entire working tree from repo root; --fail exits non-zero on any detector hit.
          docker run --rm -v "$PWD:/pwd" -w /pwd "$IMAGE" \
            filesystem . \
            --fail \
            --no-update \
            --github-actions
